version: 1.0.0

project_info:
  service_name: "crop_recommendation"
  workflow_type: "training"
  experiment_id: "EXP-001"
  stage: "mvp"
  description: "Rebanada vertical: MLP multiclase para 22 cultivos, 2 epocas."
  tags:
    - crop_recommendation
    - mlp
    - training
    - tabular
    - multiclass_classification

environment:
  device: "auto"
  seed: 42

data_source:
  dataset_name: "crop_recommendation"
  dataset_version: "v1.0.0"
  # Ruta relativa a la raiz del servicio (python/crop_recommendation).
  dataset_path: "../../datasets/ia_crop_recommendation_csv_crop_v1.0.0_training_20260812/crop_recommendation.csv"
  preprocessor_filename: "crop_recommendation_preprocessor.joblib"
  label_encoder_filename: "crop_recommendation_label_encoder.joblib"

model_config:
  model_name: "01_ia_mlp_crop_recommendation_model_v1.0.0_20260814.pt"
  model_family: "mlp"
  model_version: "v1.0.0"
  task: "multiclass_classification"

  architecture:
    hidden_layers: [64, 32]
    use_batch_norm: true
    activation_fn: "ReLU"
    dropout_rate: 0.2

  # Los 22 cultivos, en el orden alfabetico que les asigna LabelEncoder.
  classes:
    - apple
    - banana
    - blackgram
    - chickpea
    - coconut
    - coffee
    - cotton
    - grapes
    - jute
    - kidneybeans
    - lentil
    - maize
    - mango
    - mothbeans
    - mungbean
    - muskmelon
    - orange
    - papaya
    - pigeonpeas
    - pomegranate
    - rice
    - watermelon

training_params:
  test_size: 0.2
  random_state: 42

  # Solo 2 epocas: esta fase busca ver el circuito completo, no un buen
  # modelo. En la fase 07 se sube y se anade early stopping.
  epochs: 2
  batch_size: 32

  optimizer:
    name: "Adam"
    learning_rate: 0.001
    weight_decay: 0.0001

  # Sin ponderacion de clases: el dataset tiene 100 filas por cultivo.
  loss_function:
    name: "CrossEntropyLoss"

evaluation_params:
  metrics:
    - accuracy
    - precision_macro
    - recall_macro
    - f1_macro
